name: Sign hotfix manifest

# 每次改到 hotfix/ 下的东西就自动重新签名。
# 私钥存在 GitHub Secrets 里（HOTFIX_PRIVATE_KEY），永远不会出现在仓库里。

on:
  push:
    branches: [ main ]
    paths:
      - 'hotfix/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write private key
        env:
          KEY: ${{ secrets.HOTFIX_PRIVATE_KEY }}
        run: |
          # 先检查 secret 到底有没有配 —— 缺了就直接失败，
          # 而不是签出一个空签名（那会让客户端把好更新也拒掉）
          if [ -z "$KEY" ]; then
            echo "::error::缺少 secret HOTFIX_PRIVATE_KEY"
            exit 1
          fi
          printf '%s\n' "$KEY" > /tmp/k.pem
          chmod 600 /tmp/k.pem

      - name: Sign manifest
        run: |
          # 签的是 manifest.json 的原始字节。注意不要用 jq 重排后再签 ——
          # 客户端验的是它下载到的那串字节，格式一变签名就对不上。
          openssl dgst -sha256 -sign /tmp/k.pem -out /tmp/sig.der hotfix/manifest.json
          base64 < /tmp/sig.der | tr -d '\n' > hotfix/manifest.sig

      - name: Show fingerprint
        run: |
          echo "清单 SHA-256: $(sha256sum hotfix/manifest.json | cut -c1-32)…"

      - name: Commit signature
        run: |
          git config user.name  "hotfix-bot"
          git config user.email "hotfix-bot@users.noreply.github.com"
          if git diff --quiet hotfix/manifest.sig; then
            echo "签名没变，无需提交"
          else
            git add hotfix/manifest.sig
            git commit -m "chore: re-sign manifest [skip ci]"
            git push
          fi

      - name: Clean up
        if: always()
        run: rm -f /tmp/k.pem /tmp/sig.der
